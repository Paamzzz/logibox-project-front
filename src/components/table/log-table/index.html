<!DOCTYPE html>
<html lang="pt-BR">

<head>
     <meta charset="UTF-8" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <title>Tabela de Log</title>

     <!-- Estilos e ícones -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
     <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet" />
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
     <link rel="stylesheet" href="style.css" />
</head>

<body class="font-normal"> <!-- remover depois -->

     <div class="content_geral">
          <div class="container_tabela">
               <!-- Ações da tabela -->
               <div class="acoes_tabela">
                    <div class="input_pesquisa">
                         <i class="bi bi-search" aria-hidden="true"></i>
                         <input type="text" class="input_padrao" placeholder="Pesquisar..." id="pesquisa"
                              name="pesquisa" aria-label="Campo de pesquisa" />
                    </div>

                    <button class="botao_acao_tabela" id="filter-button" title="Filtrar"
                         aria-label="Filtrar resultados">
                         <i class="bi bi-filter"></i>
                    </button>

                      <div class="popup_filtro" id="popupFiltro">
                         <form method="GET" action="http://136.248.93.91/usuario.php">
                              <b>Sexo:</b><br>
                              <input type="radio" name="sexo" value="masculino"> Masculino<br>
                              <input type="radio" name="sexo" value="feminino"> Feminino<br><br>

                              <b>Tipo de usuário:</b><br>
                              <input type="radio" name="tipoUsuario" value="usuario"> Usuário<br>
                              <input type="radio" name="tipoUsuario" value="administrador"> Administrador<br><br>

                              <b>Ordenar por:</b><br>
                              <input type="radio" name="ordenar" value="asc"> A-Z<br>
                              <input type="radio" name="ordenar" value="desc"> Z-A<br><br>

                              <button type="submit" class="btn_filtrar">Aplicar filtros</button>
                         </form>
                    </div>

                    <button class="botao_acao_tabela" id="download-button" title="Baixar" aria-label="Baixar tabela">
                         <i class="bi bi-download"></i>
                    </button>
               </div>

               <!-- Tabela -->
               <div class="envoltura_tabela">
                    <table class="table_conteudo">
                         <thead>
                              <tr>
                                   <th>Data</th>
                                   <th>Nome do usuário</th>
                                   <th>Ação</th>
                              </tr>
                         </thead>

                         <tbody>
                              <tr>
                                   <td>10 de Dec 2025, 10:00</td>
                                   <td>userNome</td>
                                   <td>userAcao</td>
                              </tr>
                         </tbody>
                    </table>
               </div>
          </div>
     </div>

       <div class="menu_opcoes" id="menuUnico">
          <ul>
               <li><button class="botao_acao"><i class="bi bi-pencil-fill"></i>
                         Editar</button></li>
               <li><button class="botao_acao"><i class="bi bi-eye-fill"></i>
                         Visualizar</button></li>
               <li><button class="botao_acao"><i class="bi bi-trash-fill"></i>
                         Excluir</button></li>
          </ul>
     </div>

      <div id="backdrop" class="backdrop"></div> <!-- adiciona um backdrop para o sidebar em telas pequenas -->
      <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
     <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</body>

<script src="script.js"></script>

</html>
